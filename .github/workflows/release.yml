name: Release
on:
  push:
    branches: [main]
    paths: [package.json, .nvmrc, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["24.22.1", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --ignore-scripts --dry-run
  release:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh "$(node -p 'require("./package.json").version')"
